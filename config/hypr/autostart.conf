# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Restore previously-open apps on login (Omarchy Performance > Session Restore)
exec-once = uwsm-app -- /home/reezz-arch/.local/bin/omarchy-session-restore

# Keep KDE's app/service cache fresh (no kded6 runs on Hyprland) so Dolphin's
# "Open With" always lists apps.
exec-once = uwsm-app -- kbuildsycoca6
